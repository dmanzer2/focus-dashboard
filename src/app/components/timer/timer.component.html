<div class="timer-container" 
     [style.--breathing-intensity]="breathingIntensity()"
     [style.--progress]="progressPercent()">
  
  <!-- Circular progress ring -->
  <div class="timer-ring">
    <svg class="progress-ring" viewBox="0 0 200 200">
      <circle class="progress-ring-background" 
              cx="100" cy="100" r="90" />
      <circle class="progress-ring-progress" 
              cx="100" cy="100" r="90"
              [attr.stroke-dashoffset]="565.5 - (565.5 * progress() / 100)" />
    </svg>
    
    <!-- Timer display -->
    <div class="timer-display">
      <div class="time-text">{{ formattedTime() }}</div>
      @if (activeTask(); as task) {
        <div class="task-name">{{ task.title }}</div>
        <div class="task-difficulty" [attr.data-difficulty]="task.difficulty">
          {{ task.difficulty }}
        </div>
      } @else {
        <div class="no-task">Select a task to begin</div>
      }
    </div>
  </div>

  <!-- Controls -->
  <div class="timer-controls">
    <button 
      class="control-btn control-btn-primary"
      (click)="onStartPause()"
      [attr.aria-label]="isRunning() ? 'Pause timer' : 'Start timer'"
      [disabled]="!activeTask()">
      @if (isRunning()) {
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="6" y="4" width="4" height="16" />
          <rect x="14" y="4" width="4" height="16" />
        </svg>
        <span>Pause</span>
      } @else {
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 3 19 12 5 21 5 3" />
        </svg>
        <span>Start</span>
      }
    </button>

    <button 
      class="control-btn control-btn-secondary"
      (click)="onReset()"
      aria-label="Reset timer">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
        <path d="M21 3v5h-5" />
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
        <path d="M3 21v-5h5" />
      </svg>
      <span>Reset</span>
    </button>
  </div>
</div>
