<div class="app-container">
  <header class="app-header">
    <div class="header-content">
      <h1 class="app-title">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="12" x2="15" y2="15" />
        </svg>
        Flow State Dashboard
      </h1>
      <p class="app-subtitle">Enter your zone. Track your focus.</p>
    </div>
  </header>

  <main class="app-main">
    <div class="dashboard-grid">
      <!-- Left Column: Timer -->
      <section class="timer-section" aria-label="Focus timer">
        <app-timer />
      </section>

      <!-- Center Column: Tasks -->
      <section class="tasks-section" aria-label="Task management">
        <app-task-list />
      </section>

      <!-- Right Column: Stats -->
      <section class="stats-section" aria-label="Productivity statistics">
        <app-stats />
      </section>
    </div>
  </main>
  
  <div class="breathing-bg"></div>
  
  <!-- Celebration overlay host -->
  <app-celebration-host />
</div>
